<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Bašta Level 4 AI</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  text-align: center;
  padding: 10px;
}

h1 { color: #4CAF50; }

input, select {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
}

button {
  padding: 10px;
  margin: 6px;
  border-radius: 10px;
  border: none;
  background: #4CAF50;
  color: white;
}

.grid {
  display: grid;
  gap: 3px;
  justify-content: center;
  margin-top: 15px;
}

.cell {
  width: 55px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #333;
}

.sun { background: #2b2b16; }
.shade { background: #1c1c1c; }
.warn { background: #3a1a1a; }

.card {
  background: #1a1a1a;
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>🌱 Bašta Level 4 AI</h1>

<input id="d" type="number" value="3" step="0.5"> Dužina
<input id="s" type="number" value="1.5" step="0.5"> Širina

<br>

<select id="mesec">
  <option value="3">Mart</option>
  <option value="4" selected>April</option>
  <option value="5">Maj</option>
  <option value="6">Jun</option>
</select>

<br>

<button onclick="run()">🤖 Generiši AI plan</button>

<div id="info"></div>
<div id="grid" class="grid"></div>

<script>

const plants = [
  { e:"🍅", n:"paradajz", sun:true, water:"srednje", yield:4 },
  { e:"🌿", n:"bosiljak", sun:true, water:"srednje", yield:1 },
  { e:"🥕", n:"šargarepa", sun:false, water:"malo", yield:3 },
  { e:"🥬", n:"salata", sun:false, water:"malo", yield:2 },
  { e:"🧅", n:"luk", sun:true, water:"malo", yield:2 }
];

function weatherHint(m) {
  if(m == 3) return "🌧 hladno + vlaga";
  if(m == 4) return "🌤 idealno proleće";
  if(m == 5) return "☀ toplo i suvo";
  if(m == 6) return "🔥 vruće leto";
}

function waterPlan(m) {
  if(m == 3) return "1-2x nedeljno";
  if(m == 4) return "2-3x nedeljno";
  if(m == 5) return "svaka 2 dana";
  if(m == 6) return "svaki dan";
}

function run() {

  let d = +document.getElementById("d").value;
  let s = +document.getElementById("s").value;
  let m = +document.getElementById("mesec").value;

  let cols = Math.round(d * 2);
  let rows = Math.round(s * 2);

  let grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = `repeat(${cols}, 55px)`;

  let html = "";
  let i = 0;
  let totalYield = 0;

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){

      let p = plants[i % plants.length];
      i++;

      totalYield += p.yield;

      let sunZone = r < rows/2;

      let cls = sunZone ? "sun" : "shade";

      html += `<div class="cell ${cls}">
        ${p.e}
      </div>`;
    }
  }

  grid.innerHTML = html;

  let weather = weatherHint(m);
  let water = waterPlan(m);

  let best = "🥬 salata + 🥕 šargarepa (najstabilnije)";

  document.getElementById("info").innerHTML = `
    <div class="card">🌦 Vreme: ${weather}</div>
    <div class="card">💧 Zalivanje: ${water}</div>
    <div class="card">📊 Procena prinosa: ~${totalYield} jedinica</div>
    <div class="card">🤖 AI preporuka: ${best}</div>
  `;
}

</script>

</body>
</html>
