<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Bašta Grid 2.5</title>

<style>
body {
  font-family: Arial;
  background: #121212;
  color: white;
  text-align: center;
  padding: 10px;
}

h1 { color: #4CAF50; }

input {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
}

button {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  background: #4CAF50;
  color: white;
}

.grid {
  display: grid;
  gap: 4px;
  margin-top: 15px;
  justify-content: center;
}

.cell {
  width: 50px;
  height: 50px;
  background: #1e1e1e;
  border: 1px solid #333;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.legend {
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>🌱 Bašta Grid 2.5</h1>

<input id="duzina" type="number" value="3" step="0.5"> Dužina (m)
<input id="sirina" type="number" value="1.5" step="0.5"> Širina (m)

<br>

<button onclick="crtaj()">🧱 Nacrtaj baštu</button>

<div id="info"></div>
<div id="grid" class="grid"></div>

<script>

function crtaj() {

  let d = parseFloat(document.getElementById("duzina").value);
  let s = parseFloat(document.getElementById("sirina").value);

  // svaki 0.5m = 1 ćelija
  let cols = Math.round(d * 2);
  let rows = Math.round(s * 2);

  let ukupno = cols * rows;

  let biljke = [
    "🍅", "🌿", "🥕", "🥬", "🧅"
  ];

  let html = "";
  let grid = document.getElementById("grid");

  grid.style.gridTemplateColumns = `repeat(${cols}, 50px)`;

  let i = 0;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {

      let biljka = biljke[i % biljke.length];
      i++;

      html += `<div class="cell">${biljka}</div>`;
    }
  }

  grid.innerHTML = html;

  document.getElementById("info").innerHTML = `
    <div class="legend">
    📏 Grid: ${cols} × ${rows}<br>
    🌱 Ukupno mesta: ${ukupno}<br>
    🍅 Svaka ćelija = 0.5m × 0.5m
    </div>
  `;
}

</script>

</body>
</html>
