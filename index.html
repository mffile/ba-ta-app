<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Bašta Level 2</title>

<style>
body {
  font-family: Arial;
  background: #121212;
  color: white;
  text-align: center;
  padding: 15px;
}

h1 { color: #4CAF50; }

button {
  padding: 12px;
  margin: 8px;
  border-radius: 10px;
  border: none;
  background: #4CAF50;
  color: white;
  font-size: 16px;
}

.card {
  background: #1e1e1e;
  margin: 10px;
  padding: 15px;
  border-radius: 12px;
}

select {
  padding: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>🌱 Bašta Level 2</h1>

<p>Sanduk: 3m × 1.5m</p>

<select id="mesec">
  <option value="3">Mart</option>
  <option value="4" selected>April</option>
  <option value="5">Maj</option>
  <option value="6">Jun</option>
</select>

<br>

<button onclick="plan()">📌 Napravi plan</button>
<button onclick="savePlan()">💾 Sačuvaj</button>
<button onclick="loadPlan()">📂 Učitaj</button>
<button onclick="notify()">🔔 Podsetnik</button>

<div id="rezultat"></div>

<script>

function plan() {
  let m = document.getElementById("mesec").value;

  let sadnja = "";
  let voda = "";
  let vreme = "";
  let zemlja = "";

  if (m == 3) {
    sadnja = "Spanać, luk, grašak";
    voda = "Slabo zalivanje";
    vreme = "Hladno / mraz moguć";
    zemlja = "Donji sloj: grane + kompost";
  }

  if (m == 4) {
    sadnja = "Salata, rotkvica, šargarepa";
    voda = "2-3x nedeljno";
    vreme = "Idealno proleće";
    zemlja = "Kompost + zemlja (50/50)";
  }

  if (m == 5) {
    sadnja = "Paradajz, paprika, tikvica";
    voda = "svaka 2 dana";
    vreme = "Toplo vreme";
    zemlja = "Bogata zemlja + humus";
  }

  if (m == 6) {
    sadnja = "Krastavac, boranija";
    voda = "svaki dan";
    vreme = "Vruće leto";
    zemlja = "Malč obavezno";
  }

  let html = `
  <div class="card">🌱 Sadnja:<br>${sadnja}</div>
  <div class="card">💧 Zalivanje:<br>${voda}</div>
  <div class="card">🌦 Vreme:<br>${vreme}</div>
  <div class="card">🧱 Zemlja:<br>${zemlja}</div>

  <div class="card">
  🍅 Raspored:
  <br>Paradajz + Bosiljak
  <br>Šargarepa + Luk
  <br>Salata + Rotkvica
  </div>
  `;

  document.getElementById("rezultat").innerHTML = html;

  localStorage.setItem("plan", html);
}

// 💾 SAVE
function savePlan() {
  alert("Plan sačuvan u telefonu 💾");
}

// 📂 LOAD
function loadPlan() {
  let data = localStorage.getItem("plan");
  if (data) {
    document.getElementById("rezultat").innerHTML = data;
  } else {
    alert("Nema sačuvanog plana");
  }
}

// 🔔 NOTIFIKACIJE
function notify() {
  if (!("Notification" in window)) {
    alert("Browser ne podržava notifikacije");
    return;
  }

  Notification.requestPermission().then(p => {
    if (p === "granted") {
      new Notification("🌱 Bašta", {
        body: "Vreme je da proveriš biljke!"
      });
    }
  });
}

</script>

</body>
</html>
